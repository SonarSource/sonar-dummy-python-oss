---
on:
  pull_request:
  merge_group:
jobs:
  pre-commit:
    name: "pre-commit"
    runs-on: github-ubuntu-latest-s
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: SonarSource/ci-github-actions/config-pip@d41706a4180f70b6c0d0479795309a6c99726022 # 2.0.0
      - name: Export pip index for isolated hook venvs
        run: |
          index_url="$(python3 -c 'import configparser, pathlib; c = configparser.ConfigParser(); c.read(pathlib.Path.home() / ".pip" / "pip.conf"); print(c["global"]["index-url"])')"
          echo "::add-mask::${index_url}"
          {
            echo "PIP_INDEX_URL=${index_url}"
            echo "VIRTUALENV_INDEX_URL=${index_url}"
            echo "VIRTUALENV_PIP=embed"
            echo "VIRTUALENV_SETUPTOOLS=embed"
            echo "VIRTUALENV_WHEEL=embed"
            echo "VIRTUALENV_DOWNLOAD=false"
            echo "PIP_TRUSTED_HOST=repox.jfrog.io"
          } >> "$GITHUB_ENV"
      - uses: SonarSource/ci-github-actions/config-npm@master # dogfood
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.12
      - uses: SonarSource/gh-action_pre-commit@0ecedc4e4070444a95f6b6714ddc3ebcdde697c4 # 1.1.0
        with:
          extra-args: >
            --from-ref=origin/${{ github.event.pull_request.base.ref }} --to-ref=${{ github.event.pull_request.head.sha }}

          ignore-failure: ${{ github.event_name == 'merge_group' }}
