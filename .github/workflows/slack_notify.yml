---
name: Slack Notifications
on:
  check_suite:
    types: [completed]

permissions:
  contents: write
  id-token: write
  checks: read
jobs:
  notify:
    runs-on: github-ubuntu-latest-s
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: SonarSource/ci-github-actions/config-pip@master # dogfood
      - name: Send Slack Notification
        env:
          GITHUB_TOKEN: ${{ github.token }}
        uses: SonarSource/gh-action_slack-notify@master # dogfood
        with:
          slackChannel: squad-eng-xp-github
